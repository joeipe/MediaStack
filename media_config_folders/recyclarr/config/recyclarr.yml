# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json
radarr:
  radarr:
    base_url: http://192.168.1.111:7878
    api_key: 058d97e0172a4b19b38013770de0a0a4

    # Include baseline 1080p custom formats and profiles:
    # - Creates and sets up a new "HD Bluray + Web" Profile
    # - Creates all required Custom Formats for "HD Bluray + Web" 
    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        name: HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

    # Set up folder and file renaming to your media player standards
    # This is optional but highly recommended
    media_naming:
      folder: plex-tmdb # or jellyfin-tmdb
      movie:
        rename: true
        standard: plex-tmdb # or jellyfin-tmdb
    
    # Sets the min/pref values of Quality definitions (sizes)
    quality_definition:
      type: movie
      preferred_ratio: 0.035 # Adjust based on ideal file size - lower for smaller, higher for larger; or remove for defaults

    custom_formats:
      - trash_ids:
          # Movie versions
          - 570bc9ebecd92723d2d21500f4be314c # Remaster
          - eca37840c13c6ef2dd0262b141a5482f # 4K Remaster
          - e0c07d59beb37348e975a930d5e50319 # Criterion Collection
          - 9d27d9d2181838f76dee150882bdc58c # Masters of Cinema
          - db9b4c4b53d312a3ca5f1378f6440fc9 # Vinegar Syndrome
          - eecf3a857724171f968a66cb5719e152 # IMAX
          - 9f6cbff8cfe4ebbc1bde14c7b7bec0de # IMAX Enhanced
          #- 957d0f44b592285f26449575e8b1167e # Special Editions
          #- e9001909a4c88013a359d0b9920d7bea # Theatrical Cuts
          
          # Exclusions
          - b6832f586342ef70d9c128d40c07b872 # Bad dual groups
          - cc444569854e9de0b084ab2b8b1532b2 # B&W editions
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No RIsGroup
          - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
          - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
          - f537cf427b64c38c8e36298f657e4828 # Scene
        assign_scores_to:
          - name: HD Bluray + WEB

sonarr:
  sonarr:
    base_url: http://192.168.1.111:8989
    api_key: 34895176386d4d47998a91315c995555

    # Include baseline 1080p custom formats and profiles:
    # - Creates and sets up a new "WEB-1080p" Profile
    # - Creates all required Custom Formats for "WEB-1080p"
    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        name: WEB-1080p
        reset_unmatched_scores:
          enabled: true

    # Set up folder and file renaming to your media player standards
    # This is optional but highly recommended
    media_naming:
      series: plex-tvdb # or jellyfin-tvdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    # Sets the min/pref values of Quality definitions (sizes)
    quality_definition:
      type: series
      preferred_ratio: 0.035 # Adjust based on ideal file size - lower for smaller, higher for larger

    custom_formats:
      # Optional exclusion formats
      - trash_ids:
          - 32b367365729d530ca1c124a0b180c64 # Bad dual groups
          - 82d40da2bc6923f41e14394075dd4b03 # No-RIs group
          - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
          - 06d66ab109d4d2eddb2794d21526d140 # Retags
          - 1b3994c551cbb92a2c781af061f4ab44 # Scene
        assign_scores_to:
          - name: WEB-1080p