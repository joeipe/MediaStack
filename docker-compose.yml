version: "3.8"

services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - 8080:8080 # qBittorrent
      - 6881:6881 # qBittorrent TCP
      - 6881:6881/udp # qBittorrent UDP
      - 8989:8989 # Sonarr
      - 7878:7878 # Radarr
      - 9696:9696 # Prowlarr
      - 6767:6767 # Bazarr
      - 8686:8686 # lidarr
      - 5030:5030 # slskd Web UI/API
      - 8265:8265 # Soularr Web UI
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - OPENVPN_USER=${NORDVPN_USER}
      - OPENVPN_PASSWORD=${NORDVPN_PASSWORD}
      - SERVER_COUNTRIES=${VPN_COUNTRY}
    volumes:
      - /volume1/mediastack/gluetun:/gluetun
    restart: unless-stopped
    healthcheck:
      test: /gluetun-entrypoint healthcheck
      interval: 30s
      timeout: 10s
      retries: 3

  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Australia/Sydney
      - WEBUI_PORT=8080
    volumes:
      - /volume1/mediastack/qbittorrent/config:/config
      - /volume1/mediastack/qbittorrent/downloads:/downloads
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Australia/Sydney
    volumes:
      - /volume1/mediastack/sonarr/config:/config
      - /volume1/mediastack/sonarr/tv:/tv
      - /volume1/mediastack/qbittorrent/downloads:/downloads
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr
    container_name: radarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Australia/Sydney
    volumes:
      - /volume1/mediastack/radarr/config:/config
      - /volume1/mediastack/radarr/movies:/movies
      - /volume1/mediastack/qbittorrent/downloads:/downloads
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Australia/Sydney
    volumes:
      - /volume1/mediastack/lidarr/config:/config
      - /volume1/mediastack/lidarr/music:/music
      - /volume1/mediastack/qbittorrent/downloads:/downloads
      - /volume1/mediastack/slskd/downloads:/slskd-downloads
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Australia/Sydney
    volumes:
      - /volume1/mediastack/prowlarr/config:/config
    restart: unless-stopped

  bazarr:
    image: linuxserver/bazarr
    container_name: bazarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Australia/Sydney
    volumes:
      - /volume1/mediastack/bazarr/config:/config
      - /volume1/mediastack/sonarr/tv:/tv
      - /volume1/mediastack/radarr/movies:/movies
    restart: unless-stopped
    
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:edge
    container_name: recyclarr
    user: "${PUID}:${PGID}"
    volumes:
      - /volume1/mediastack/recyclarr/config:/config
    environment:
      - TZ=Australia/Sydney
    restart: unless-stopped

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Australia/Sydney
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_SLSK_USERNAME=${SLSKD_SLSK_USER}
      - SLSKD_SLSK_PASSWORD=${SLSKD_SLSK_PASSWORD}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
    volumes:
      - /volume1/mediastack/slskd:/app
      - /volume1/mediastack/slskd/downloads:/downloads
    restart: unless-stopped

  soularr:
    image: mrusse08/soularr:latest
    container_name: soularr
    user: "${PUID}:${PGID}"
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
      slskd:
        condition: service_started
      lidarr:
        condition: service_started
    environment:
      - TZ=Australia/Sydney
      - SCRIPT_INTERVAL=300
      - WEBUI_ENABLED=true
    volumes:
      - /volume1/mediastack/slskd/downloads:/downloads
      - /volume1/mediastack/soularr:/data
    restart: unless-stopped

  jellyfin:
    image: linuxserver/jellyfin
    container_name: jellyfin
    ports:
      - 8096:8096
    networks:
      - media_net
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Australia/Sydney
    volumes:
      - /volume1/mediastack/jellyfin/config:/config
      - /volume1/mediastack/jellyfin/cache:/cache
      - /volume1/mediastack/sonarr/tv:/tv
      - /volume1/mediastack/radarr/movies:/movies
      - /volume1/mediastack/lidarr/music:/music
    restart: unless-stopped

networks:
  media_net:
